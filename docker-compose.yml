services:
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10

  postgres:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./postgres.dev.env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superuser", "-d", "devdb"]
      interval: 2s
      timeout: 1s
      retries: 10

  rest_api:
    build:
      context: ./backend
      dockerfile: rest_api/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ./rest_api.dev.env
    volumes:
      - ./backend/rest_api:/app
    # python:slim has no curl, so the check is done with the stdlib
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ws_gateway:
    build:
      context: ./backend
      dockerfile: ws_gateway/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # rest_api runs the Alembic migrations; the gateway assumes the tables exist
      rest_api:
        condition: service_healthy
    env_file:
      - ./ws_gateway.dev.env
    volumes:
      - ./backend/ws_gateway:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  event_consumer:
    build:
      context: ./backend
      dockerfile: event_consumer/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./event_consumer.dev.env
    volumes:
      - ./backend/event_consumer:/app

  lease_manager:
    build:
      context: ./backend
      dockerfile: lease_manager/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./lease_manager.dev.env
    volumes:
      - ./backend/lease_manager:/app

  # Voice SFU. Media is UDP straight from the browser to 7882 on the host — it
  # does not go through Caddy, and it never touches the Redis/gRPC chat path.
  # Only the signalling websocket (7880) is proxied, at /livekit.
  livekit:
    # Keep in step with `livekit-client` in frontend/package.json: a client
    # newer than the server probes /rtc/v1, 404s, and only then falls back.
    image: livekit/livekit-server:v1.10
    command: --config /etc/livekit.yaml
    env_file:
      - ./livekit.dev.env
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  edge:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - rest_api
      - ws_gateway
      - frontend
      - livekit
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
