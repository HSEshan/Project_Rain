# Production stack. Deployed onto a VPS that already runs host Nginx for
# another app, so this file assumes that shape: images are built here rather
# than pulled, and the Caddy edge sits on 127.0.0.1:8081 with Nginx terminating
# TLS in front of it. See DEPLOY.md.
name: project-rain

services:
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `$$` so Compose passes the variable through and the container's shell
      # expands it. A single `$` would interpolate on the host, where these are
      # unset — env_file values are not available for Compose substitution —
      # and `pg_isready -U "" -d ""` never goes healthy, so nothing that
      # depends on postgres would ever start.
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rest_api:
    build:
      context: ./backend
      dockerfile: rest_api/Dockerfile
    # The Dockerfile CMD ends in --reload, which in dev watches a bind mount
    # that does not exist here.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ./rest_api.env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  ws_gateway:
    build:
      context: ./backend
      dockerfile: ws_gateway/Dockerfile
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ./ws_gateway.env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # rest_api runs the Alembic migrations; the gateway assumes tables exist
      rest_api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  event_consumer:
    build:
      context: ./backend
      dockerfile: event_consumer/Dockerfile
    env_file:
      - ./event_consumer.env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  lease_manager:
    build:
      context: ./backend
      dockerfile: lease_manager/Dockerfile
    # Its Config reads REDIS_* and NUM_STREAMS with no defaults and raises on
    # a missing one, so this file is required, not optional.
    env_file:
      - ./lease_manager.env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  # Voice SFU. Signalling is proxied by Caddy at /livekit; media is WebRTC over
  # UDP straight to 7882, which must be open on the host firewall AND on the
  # provider's security group — no proxy can carry it, and voice fails as
  # "connects, then nobody can hear anyone" if it is closed. livekit.yaml must
  # set `use_external_ip: true` instead of the dev config's loopback node_ip,
  # so ICE advertises a reachable address.
  livekit:
    image: livekit/livekit-server:v1.10
    command: --config /etc/livekit.yaml
    env_file:
      - ./livekit.env
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped

  # Edge caddy: routes /api, /ws, /livekit and the SPA. It is NOT the public
  # entrypoint — host Nginx terminates TLS and proxies here, so this binds to
  # loopback and speaks plain HTTP. Use Caddyfile.example.
  edge:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - rest_api
      - ws_gateway
      - frontend
      - livekit
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
