# Alembic config for Project Rain.
#
# rest_api owns the schema: it is the only service that runs migrations, and it
# runs `upgrade head` on startup (src/database/migrate.py). ws_gateway waits for
# rest_api to be healthy before it connects.
#
# `sqlalchemy.url` is intentionally empty — env.py fills it from the same
# settings object the app uses, so there is one source for the DSN.

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
